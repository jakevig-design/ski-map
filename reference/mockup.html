<title>Jake's Ski Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed poster map with a slim ledger rail on the right; rail drops below the map on phones */
:root{
  --water:#8c9fa8; --water-deep:#7a8e98;
  --land:#eef0ea; --land-out:#d9ddd6; --sage:#c9d3b4;
  --line:#b9c1bb; --ink:#26302f; --muted:#66716f;
  --pin:#c4283d; --plan:#2f7d8c; --paper:#f6f6f2; --rule:#dfe2dc;
  --display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%;min-height:560px}
.mapwrap{position:relative;background:var(--water);overflow:hidden;min-width:0}
svg#map{width:100%;height:100%;display:block;cursor:grab}
svg#map:active{cursor:grabbing}
.land{fill:var(--land)}
.admin-out{fill:var(--land-out);stroke:var(--line);stroke-width:.5}
.admin-us{fill:var(--land);stroke:var(--line);stroke-width:.6}
.land,.admin-us,.admin-out,.lake,.country{vector-effect:non-scaling-stroke}
.lake{fill:var(--water);stroke:none}
.country{fill:none;stroke:#9aa59f;stroke-width:1}
.tri{stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round;fill:#cfd5d2}
.mtn.planned .tri{fill:#e4ecec;stroke:var(--plan)}
.head{stroke:#7e1424;stroke-width:.8;fill:var(--pin)}
.mtn.planned .head{fill:var(--plan);stroke:#1d5560}
.mtn{cursor:pointer}
.mtn:hover .tri,.mtn.sel .tri{fill:#fff}
.lbl{font-family:var(--display);font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.lbl .x{font-family:var(--mono);font-size:.82em;fill:var(--pin)}
.mtn.planned .lbl{fill:var(--plan);font-style:italic}

.title{transition:opacity .3s;position:absolute;right:24px;bottom:22px;text-align:right;pointer-events:none;color:var(--paper)}
.title h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,58px);line-height:.9;margin:0;letter-spacing:.01em;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.title p{margin:6px 0 0;font-family:var(--display);font-weight:500;font-size:clamp(14px,1.6vw,19px);opacity:.92}
.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:6px;border:1px solid rgba(0,0,0,.15);background:var(--paper);color:var(--ink);font:600 17px var(--ui);cursor:pointer}
.zoom button:focus-visible,.btn:focus-visible,.row:focus-visible{outline:2px solid var(--plan);outline-offset:2px}

.rail{background:var(--paper);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.stat{padding:16px 14px 12px;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat b{display:block;font:500 28px/1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;font:500 13px var(--ui);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.list{overflow:auto;flex:1;padding-bottom:16px}
.grp{padding:14px 14px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit}
.row:hover,.row.sel{background:#eceee8}
.row .n{font-family:var(--display);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.planned .n{color:var(--plan);font-style:italic}
.row .meta{display:flex;gap:6px;align-items:center}
.cnt{font:500 13px var(--mono);color:var(--pin);font-variant-numeric:tabular-nums}
.yrs{font:500 13px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.yrs .tbd{color:var(--muted);font-family:var(--ui);font-size:12px}
.ord{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.yin{width:84px;font:500 14px var(--mono);padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
.chip{font:600 10px var(--ui);letter-spacing:.06em;border:1px solid var(--line);border-radius:999px;padding:1px 6px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tag{font:600 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--plan)}

.card{position:absolute;left:24px;top:20px;width:min(320px,calc(100% - 48px));background:var(--paper);border-radius:8px;box-shadow:0 8px 28px rgba(20,30,30,.22);padding:16px 16px 14px}
.card h2{margin:0;font:700 24px/1.05 var(--display);text-wrap:balance}
.card .sub{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.card .big{display:flex;align-items:baseline;gap:8px;margin:14px 0 10px}
.card .big b{font:500 40px/1 var(--mono);color:var(--pin)}
.card.planned .big b{color:var(--plan)}
.trips{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.trips li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.yr{font:500 14px var(--mono)}
.yr.tbd{color:var(--muted)}
.who{display:flex;gap:4px}
.who button{cursor:default}
.edit .who button{cursor:pointer}
.close{position:absolute;right:8px;top:8px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;width:30px;height:30px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:7px 12px;font:600 13px var(--ui);cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}
.btn.plan{background:var(--plan);border-color:var(--plan)}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.editor{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.editor input{accent-color:var(--plan)}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .rail{border-left:0;border-top:1px solid var(--rule);overflow:visible}
  .list{overflow:visible}
  .title{right:16px;bottom:14px}
  .card{left:16px;top:12px;width:calc(100% - 32px - 46px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="Map of North America with pins on every ski area Jake has skied"></svg>
    <div class="title"><h1>SKI AREAS</h1><p>every mountain Jake has skied</p></div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zhome" aria-label="Reset view" style="font-size:13px">&#8962;</button></div>
    <div class="card" id="card" hidden></div>
  </div>
  <aside class="rail">
    <div class="stats">
      <div class="stat"><b id="sM">0</b><span>Mountains</span></div>
      <div class="stat"><b id="sT">0</b><span>Trips</span></div>
      <div class="stat"><b id="sR">0</b><span>States &amp; prov.</span></div>
    </div>
    <div class="bar">
      <div class="legend"><span><i style="background:var(--pin)"></i>Skied</span><span><i style="background:var(--plan)"></i>Planned</span></div>
      <label class="editor"><input type="checkbox" id="edit"> Editor view</label>
    </div>
    <div class="bar" style="padding-block:8px"><span class="tag" style="color:var(--muted)" id="mnote">Mockup · years not entered yet</span><label class="editor"><input type="checkbox" id="sample"> Show sample years</label></div>
    <div class="list" id="list"></div>
  </aside>
</div>

// Sample years exist only to preview the layout. They are fake and never shown unless "Show sample years" is on.
function sampleYear(m,i){const base=2008+((m.id*7)%15);return base+i*3}
function yearOf(m,i){const t=m.trips[i];return t.y||(sample?sampleYear(m,i):null)}
function sorted(m){return m.trips.map((t,i)=>({t,i})).sort((a,b)=>(yearOf(m,a.i)||9999)-(yearOf(m,b.i)||9999))}
function yrs(m){const ys=m.trips.map((_,i)=>yearOf(m,i)).filter(Boolean).sort();if(!ys.length)return '<span class="tbd">Year TBD</span>';return ys.join(" · ")}
const svg=d3.select("#map"), wrap=document.getElementById("mapwrap");
const g=svg.append("g"), gBase=g.append("g"), gPins=g.append("g");
const proj=d3.geoConicConformal().rotate([96,0]).parallels([33,60]);
const path=d3.geoPath(proj);

const land=topojson.feature(GEO.land,GEO.land.objects.land);
const admin=topojson.feature(GEO.admin,GEO.admin.objects.admin);
const lakes=topojson.feature(GEO.lakes,GEO.lakes.objects.lakes);
const usMesh=topojson.mesh(GEO.admin,GEO.admin.objects.admin,(a,b)=>a!==b && a.properties.iso_a2!==b.properties.iso_a2);

function size(){const r=wrap.getBoundingClientRect();return [r.width,r.height]}
function fit(){
  const [w,h]=size(); svg.attr("viewBox",[0,0,w,h]);
  const frame={type:"MultiPoint",coordinates:[[-125,32],[-66,46],[-123,51],[-70,44.5],[-112,33.5]]};
  proj.fitExtent([[40,50],[w-30,h-110]],frame);
  gBase.selectAll("*").remove();
  gBase.append("path").datum(land).attr("class","land").attr("d",path);
  gBase.selectAll(".a").data(admin.features).join("path").attr("class",d=>d.properties.iso_a2==="US"?"admin-us":"admin-out").attr("d",path);
  gBase.append("path").datum(lakes).attr("class","lake").attr("d",path);
  gBase.append("path").datum(usMesh).attr("class","country").attr("d",path);
  M.forEach(m=>{[m.x,m.y]=proj([m.lon,m.lat])});
}

let k=1;
const zoom=d3.zoom().scaleExtent([1,40]).on("zoom",e=>{k=e.transform.k;g.attr("transform",e.transform);document.querySelector(".title").style.opacity=e.transform.k>1.6?0:1;gBase.selectAll("path").attr("stroke-width",null).style("vector-effect","non-scaling-stroke");drawPins()});
svg.call(zoom).on("dblclick.zoom",null);

function visible(m){ if(filter==="all") return true; return m.status==="skied" && m.trips.some(t=>t[filter]); }

function drawPins(){
  const s=Math.min(1/k*1.0, 1)* (k>1? Math.pow(k,0.35):1); // pins grow gently while zooming
  const r=7*s/ (k>1?1:1);
  const data=M.filter(visible).sort((a,b)=>a.lat-b.lat);
  const sel_=gPins.selectAll(".mtn").data(data,d=>d.id).join(enter=>{
    const e=enter.append("g").attr("class","mtn").attr("tabindex",-1);
    e.append("path").attr("class","tri");
    e.append("circle").attr("class","head");
    e.append("text").attr("class","lbl");
    e.on("click",(ev,d)=>{ev.stopPropagation();select(d.id,true)});
    return e;});
  const sz=9/k*Math.pow(k,0.25), fs=12.5/k*Math.pow(k,0.2), fsS=12.5*Math.pow(k,0.2);
  sel_.attr("class",d=>"mtn "+d.status+(d.id===sel?" sel":""))
      .attr("transform",d=>`translate(${d.x},${d.y})`);
  sel_.select(".tri").attr("d",`M0,${-sz}L${sz*1.15},${sz*.75}L${-sz*1.15},${sz*.75}Z`).attr("stroke-width",1.3/k*Math.pow(k,0.2));
  sel_.select(".head").attr("cx",sz*.35).attr("cy",-sz*.85).attr("r",sz*.38);
  // label collision in screen space
  const placed=[]; const order=data.slice().sort((a,b)=>(b.id===sel)-(a.id===sel)||b.trips.length-a.trips.length||a.name.length-b.name.length);
  const t=d3.zoomTransform(svg.node());
  const show=new Set();
  data.forEach(d=>{const [sx,sy]=t.apply([d.x,d.y]);const q=sz*k*1.15;placed.push([sx-q,sy-q,sx+q,sy+q*0.75])});
  const side=new Map(); const [VW,VH]=size();
  const hit=box=>box[0]<4||box[2]>VW-4||box[1]<4||box[3]>VH-4||placed.some(b=>!(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3]));
  order.forEach(d=>{const [sx,sy]=t.apply([d.x,d.y]);const w=(d.name.length+(d.trips.length>1?3:0))*fsS*0.56,h=fsS*1.2,ox=sz*1.35*k;
    const R=[sx+ox,sy-h*0.6,sx+ox+w,sy+h*0.4], L=[sx-ox-w,sy-h*0.6,sx-ox,sy+h*0.4];
    if(!hit(R)){placed.push(R);show.add(d.id);side.set(d.id,1)} else if(!hit(L)){placed.push(L);show.add(d.id);side.set(d.id,-1)}
  });
  sel_.select(".lbl").attr("x",d=>sz*1.35*(side.get(d.id)||1)).attr("text-anchor",d=>side.get(d.id)===-1?"end":"start").attr("y",sz*.45).attr("font-size",fs).style("stroke-width",3/k*Math.pow(k,0.2)+"px")
    .attr("display",d=>show.has(d.id)?null:"none")
    .html(d=>`${d.name}${d.trips.length>1?` <tspan class="x">${d.trips.length}×</tspan>`:""}`);
}

function stats(){
  const sk=M.filter(m=>m.status==="skied"&&visible(m));
  const trips=sk.reduce((a,m)=>a+m.trips.filter(t=>filter==="all"||t[filter]).length,0);
  d3.select("#sM").text(sk.length); d3.select("#sT").text(trips); d3.select("#sR").text(new Set(sk.map(m=>m.reg)).size);
}

function list(){
  const el=document.getElementById("list"); el.innerHTML="";
  ORDER.forEach(r=>{
    const ms=M.filter(m=>m.reg===r&&visible(m)).sort((a,b)=>(a.status>b.status?-1:1)||b.trips.length-a.trips.length||a.name.localeCompare(b.name));
    if(!ms.length) return;
    const grp=document.createElement("div"); grp.className="grp";
    grp.innerHTML=`<span>${REGION[r]}</span><span>${ms.filter(m=>m.status==="skied").length}</span>`; el.appendChild(grp);
    ms.forEach(m=>{
      const b=document.createElement("button"); b.className="row "+m.status+(m.id===sel?" sel":""); b.id="row"+m.id;
      b.innerHTML=`<span class="n">${m.name}</span><span class="meta">${m.status==="planned"?'<span class="tag">Planned</span>':`<span class="yrs">${yrs(m)}</span>${m.trips.length>1?`<span class="cnt">${m.trips.length}×</span>`:""}`}</span>`;
      b.onclick=()=>select(m.id,true); el.appendChild(b);
    });
  });
}

function card(){
  const c=document.getElementById("card"); const m=M.find(x=>x.id===sel);
  if(!m){c.hidden=true;return}
  c.hidden=false; c.className="card "+m.status+(editing?" edit":"");
  const n=m.trips.length;
  let h=`<button class="close" aria-label="Close" id="cx">&times;</button><h2>${m.name}</h2><div class="sub">${REGION[m.reg]}</div>`;
  if(m.status==="planned"){
    h+=`<div class="big"><b>0×</b><span>planned, not yet skied</span></div>`;
    h+= editing?`<div class="actions"><button class="btn plan" id="mark">Mark as skied</button><button class="btn ghost" id="drop">Remove</button></div><div class="note">Marking it skied turns the pin red and logs the first trip.</div>`
               :`<div class="note">On the list for this season.</div>`;
  } else {
    h+=`<div class="big"><b>${n}×</b><span>${n===1?"trip":"trips"}</span></div><ul class="trips">`;
    sorted(m).forEach(({t,i},j)=>{const y=yearOf(m,i);h+=`<li><span class="ord">Trip ${j+1}</span>${editing?`<input class="yin" id="y${m.id}_${i}" data-i="${i}" type="number" inputmode="numeric" min="1980" max="2035" placeholder="Year" value="${t.y||""}" aria-label="Year of trip ${i+1}">`:`<span class="yr ${y?"":"tbd"}">${y||"Year TBD"}</span>`}</li>`});
    h+=`</ul>`;
    if(editing) h+=`<div class="actions"><button class="btn" id="add">Add trip</button></div><div class="note">Editor view is what you see when signed in. Visitors see the read-only card.</div>`;
  }
  c.innerHTML=h;
  c.querySelector("#cx").onclick=()=>{sel=null;refresh()};
  if(editing){
    c.querySelectorAll(".yin").forEach(inp=>inp.onchange=()=>{const v=parseInt(inp.value,10);m.trips[+inp.dataset.i].y=(v>=1980&&v<=2035)?v:null;drawPins();list()});
    const add=c.querySelector("#add"); if(add) add.onclick=()=>{m.trips.push({y:null});refresh()};
    const mk=c.querySelector("#mark"); if(mk) mk.onclick=()=>{m.status="skied";m.trips=[{y:new Date().getFullYear()}];refresh()};
    const dr=c.querySelector("#drop"); if(dr) dr.onclick=()=>{M.splice(M.indexOf(m),1);sel=null;refresh()};
  }
}

function select(id,fly){
  sel=id; refresh();
  const m=M.find(x=>x.id===id); if(!m||!fly) return;
  const [w,h]=size(); const kk=Math.max(d3.zoomTransform(svg.node()).k,6);
  svg.transition().duration(matchMedia("(prefers-reduced-motion:reduce)").matches?0:750)
     .call(zoom.transform,d3.zoomIdentity.translate(w*0.6-m.x*kk,h*0.55-m.y*kk).scale(kk));
  const row=document.getElementById("row"+id); if(row) row.scrollIntoView({block:"nearest"});
}
function refresh(){drawPins();stats();list();card()}

document.getElementById("sample").onchange=e=>{sample=e.target.checked;document.getElementById("mnote").textContent=sample?"Sample years, not real":"Mockup · years not entered yet";refresh()};
document.getElementById("edit").onchange=e=>{editing=e.target.checked;card()};
document.getElementById("zin").onclick=()=>svg.transition().call(zoom.scaleBy,1.8);
document.getElementById("zout").onclick=()=>svg.transition().call(zoom.scaleBy,1/1.8);
document.getElementById("zhome").onclick=()=>{sel=null;refresh();svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity)};
svg.on("click",()=>{if(sel!==null){sel=null;refresh()}});
fit(); refresh();
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{fit();svg.call(zoom.transform,d3.zoomIdentity);refresh()},150)});
</script>
